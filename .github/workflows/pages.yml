name: Deploy Angular app to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'random-numbers-app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: random-numbers-app/package-lock.json

      - name: Install dependencies
        working-directory: random-numbers-app
        run: npm ci

      - name: Build Angular app
        working-directory: random-numbers-app
        run: npm run build -- --base-href /random-numbers/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: random-numbers-app/dist/random-numbers-app/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
